<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alabama Termite Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    #app { display: flex; height: 100vh; }
    #sidebar {
      width: 300px;
      flex: 0 0 300px;
      box-sizing: border-box;
      padding: 18px;
      border-right: 1px solid #ddd;
      background: #fff;
      overflow-y: auto;
      z-index: 1000;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .intro { margin: 0 0 20px; color: #555; font-size: 0.9rem; line-height: 1.4; }
    .control-group { margin-bottom: 18px; }
    .control-label { display: block; margin-bottom: 6px; font-size: 0.78rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }
    select { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 0.92rem; }
    .checks { display: flex; flex-direction: column; gap: 9px; font-size: 0.9rem; line-height: 1.3; }
    .checks label { display: flex; gap: 7px; align-items: flex-start; }
    .checks input { margin-top: 2px; }
    #status { padding-top: 12px; border-top: 1px solid #e5e5e5; color: #666; font-size: 0.82rem; line-height: 1.45; }
    #map { flex: 1; min-width: 0; height: 100%; }
    .leaflet-popup-content { line-height: 1.4; }
    .species { font-style: italic; font-weight: 700; }
    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      line-height: 1.5;
      font-size: 0.82rem;
    }
    .legend-title { font-weight: 700; margin-bottom: 4px; }
    .legend-item { white-space: nowrap; }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid #333;
      vertical-align: -1px;
    }
    .legend-dot-inat {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin: 0 7px 0 1px;
      border: 1px solid #4a4a4a;
      background: #666;
      vertical-align: -1px;
    }
    .legend-box {
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 6px;
      border: 1px solid #a33;
      background: rgba(215, 48, 39, 0.28);
      vertical-align: -1px;
    }
    .legend-species { font-style: italic; }
    @media (max-width: 700px) {
      body { overflow: auto; }
      #app { display: block; height: auto; }
      #sidebar {
        width: 100%;
        box-sizing: border-box;
        border-right: none;
        border-bottom: 1px solid #ddd;
        padding: 14px 16px;
      }
      .intro { margin-bottom: 12px; }
      .control-group { margin-bottom: 12px; }
      #map { height: 68vh; min-height: 440px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Alabama Termite Map</h1>
      <p class="intro">Documented termite records from AU voucher specimens, published county-level FST records, and optional iNaturalist observations.</p>

      <div class="control-group">
        <label class="control-label" for="genus-select">Genus</label>
        <select id="genus-select">
          <option value="all">All genera</option>
          <option value="Coptotermes">Coptotermes</option>
          <option value="Reticulitermes">Reticulitermes</option>
          <option value="Kalotermes">Kalotermes</option>
        </select>
      </div>

      <div class="control-group">
        <span class="control-label">Evidence</span>
        <div class="checks">
          <label><input type="checkbox" id="fst-toggle" checked> <span>FST county records</span></label>
          <label><input type="checkbox" id="specimen-toggle" checked> <span>Verified specimen points</span></label>
          <label><input type="checkbox" id="inat-toggle"> <span>iNaturalist Research Grade</span></label>
        </div>
      </div>

      <div id="status">Loading map data...</div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([32.8, -86.8], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const countyUrl = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/19/query?where=STATE%3D%2701%27&outFields=GEOID%2CBASENAME%2CNAME&returnGeometry=true&outSR=4326&f=geojson";
    const focalGenera = ['Coptotermes', 'Reticulitermes', 'Kalotermes'];

    const genusColors = {
      Coptotermes: '#d73027',
      Reticulitermes: '#2166ac',
      Kalotermes: '#1a9850'
    };

    const countyLayer = L.layerGroup().addTo(map);
    const inatLayer = L.layerGroup().addTo(map);
    const specimenLayer = L.layerGroup().addTo(map);

    let museumRecords = [];
    let fstRecords = [];
    let inatRecords = [];
    let inatLoaded = false;
    let inatLoading = false;
    let inatError = '';
    let countyGeojson = null;
    let legendControl = null;

    function speciesName(row) {
      return [row.genus, row.species].filter(Boolean).join(' ') || 'Unidentified termite';
    }

    function normalizeCounty(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+county$/, '');
    }

    function parseCsv(text) {
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: header => header.replace(/^\uFEFF/, '').trim()
      });
      if (parsed.errors.length) throw new Error(parsed.errors[0].message);
      return parsed.data;
    }

    function selectedGenus() {
      return document.getElementById('genus-select').value;
    }

    function genusMatches(genus) {
      const selected = selectedGenus();
      return selected === 'all' || genus === selected;
    }

    function fstIsRelevant() {
      const selected = selectedGenus();
      return selected === 'all' || selected === 'Coptotermes';
    }

    function pointInRing(lon, lat, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0];
        const yi = ring[i][1];
        const xj = ring[j][0];
        const yj = ring[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < ((xj - xi) * (lat - yi) / (yj - yi)) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(lon, lat, polygon) {
      if (!polygon.length || !pointInRing(lon, lat, polygon[0])) return false;
      for (let i = 1; i < polygon.length; i++) {
        if (pointInRing(lon, lat, polygon[i])) return false;
      }
      return true;
    }

    function pointInAlabama(lon, lat) {
      if (!countyGeojson) return false;
      return countyGeojson.features.some(feature => {
        const geometry = feature.geometry;
        if (!geometry) return false;
        if (geometry.type === 'Polygon') return pointInPolygon(lon, lat, geometry.coordinates);
        if (geometry.type === 'MultiPolygon') {
          return geometry.coordinates.some(polygon => pointInPolygon(lon, lat, polygon));
        }
        return false;
      });
    }

    function updateLegend(visibleMuseumRecords, showFst, showInat) {
      if (legendControl) map.removeControl(legendControl);

      const visibleGenera = [...new Set(visibleMuseumRecords.map(row => row.genus).filter(Boolean))].sort();
      legendControl = L.control({ position: 'bottomright' });
      legendControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        const genusItems = visibleGenera.map(genus =>
          `<div class="legend-item"><span class="legend-dot" style="background:${genusColors[genus]}"></span><span class="legend-species">${genus}</span> specimen</div>`
        ).join('');
        const fstItem = showFst
          ? '<div class="legend-item"><span class="legend-box"></span><span class="legend-species">Coptotermes formosanus</span> FST county</div>'
          : '';
        const inatItem = showInat
          ? '<div class="legend-item"><span class="legend-dot-inat"></span>iNaturalist Research Grade</div>'
          : '';
        div.innerHTML = `<div class="legend-title">Records</div>${genusItems}${fstItem}${inatItem}`;
        return div;
      };
      legendControl.addTo(map);
    }

    function drawMap() {
      countyLayer.clearLayers();
      inatLayer.clearLayers();
      specimenLayer.clearLayers();

      const showSpecimens = document.getElementById('specimen-toggle').checked;
      const showFst = document.getElementById('fst-toggle').checked && fstIsRelevant();
      const showInat = document.getElementById('inat-toggle').checked && inatLoaded;
      const visibleMuseumRecords = museumRecords.filter(row => genusMatches(row.genus));
      const visibleInatRecords = inatRecords.filter(row => genusMatches(row.genus));

      if (showFst && countyGeojson) {
        const fstByCounty = Object.fromEntries(
          fstRecords.map(row => [normalizeCounty(row.County), row])
        );

        L.geoJSON(countyGeojson, {
          filter: feature => Boolean(fstByCounty[normalizeCounty(feature.properties.BASENAME)]),
          style: {
            color: '#a32121',
            weight: 1.2,
            fillColor: genusColors.Coptotermes,
            fillOpacity: 0.25
          },
          onEachFeature: (feature, layer) => {
            const record = fstByCounty[normalizeCounty(feature.properties.BASENAME)];
            layer.bindPopup([
              '<span class="species">Coptotermes formosanus</span>',
              `${record.County} County`,
              `First detected: ${record.FirstDetectedYear}`,
              'Evidence: published county-level FST record',
              'County shading indicates documented occurrence, not occurrence throughout the county.'
            ].join('<br>'));
          }
        }).addTo(countyLayer);
      }

      if (showInat) {
        for (const row of visibleInatRecords) {
          const popup = [
            `<span class="species">${row.name}</span>`,
            row.place || 'Alabama',
            row.observedOn ? `Observed: ${row.observedOn}` : '',
            'Evidence: iNaturalist Research Grade',
            'Not independently verified by the Alabama Termite Identification Service',
            `<a href="https://www.inaturalist.org/observations/${row.id}" target="_blank" rel="noopener">View iNaturalist observation</a>`
          ].filter(Boolean).join('<br>');

          L.circleMarker([row.lat, row.lon], {
            radius: 5,
            color: '#4a4a4a',
            weight: 1.3,
            fillColor: '#666',
            fillOpacity: 0.82
          }).bindPopup(popup).addTo(inatLayer);
        }
      }

      if (showSpecimens) {
        for (const row of visibleMuseumRecords) {
          const lat = Number(row.lat);
          const lon = Number(row.lon);
          const name = speciesName(row);
          const place = [row.locality, row.city].filter(Boolean).join(', ');
          const popup = [
            `<span class="species">${name}</span>`,
            row.AUT_ID ? `Voucher: ${row.AUT_ID}` : '',
            place || 'Alabama',
            row.date ? `Collected: ${row.date}` : '',
            'Evidence: verified specimen',
            'Source: AU Natural History Museum'
          ].filter(Boolean).join('<br>');

          L.circleMarker([lat, lon], {
            radius: 6,
            color: '#333',
            weight: 1,
            fillColor: genusColors[row.genus],
            fillOpacity: 0.88
          }).bindPopup(popup).addTo(specimenLayer);
        }
      }

      updateLegend(showSpecimens ? visibleMuseumRecords : [], showFst && Boolean(countyGeojson), showInat);

      const pointCount = showSpecimens ? visibleMuseumRecords.length : 0;
      const inatCount = showInat ? visibleInatRecords.length : 0;
      const selected = selectedGenus() === 'all' ? 'all three focal genera' : selectedGenus();
      const parts = [`${pointCount} verified specimens for ${selected}`];
      if (showFst) parts.push(`${fstRecords.length} FST counties`);
      if (document.getElementById('inat-toggle').checked) {
        if (inatLoading) parts.push('loading iNaturalist records');
        else if (inatLoaded) parts.push(`${inatCount} iNaturalist Research Grade observations`);
      }
      if (inatError) parts.push('iNaturalist layer unavailable');
      document.getElementById('status').textContent = `${parts.join('; ')}.`;
    }

    async function fetchInatGenus(genus) {
      const records = [];
      let page = 1;
      let total = 1;
      let received = 0;

      while (received < total) {
        const params = new URLSearchParams({
          taxon_name: genus,
          quality_grade: 'research',
          geo: 'true',
          swlat: '30.1',
          swlng: '-88.6',
          nelat: '35.2',
          nelng: '-84.8',
          per_page: '200',
          page: String(page),
          order_by: 'id',
          order: 'asc'
        });

        const response = await fetch(`https://api.inaturalist.org/v1/observations?${params}`);
        if (!response.ok) throw new Error(`iNaturalist request failed: ${response.status}`);
        const data = await response.json();
        total = data.total_results || 0;
        const results = data.results || [];
        received += results.length;

        for (const obs of results) {
          const coordinates = obs.geojson && obs.geojson.coordinates;
          if (!coordinates || coordinates.length < 2) continue;
          const lon = Number(coordinates[0]);
          const lat = Number(coordinates[1]);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
          if (!pointInAlabama(lon, lat)) continue;

          records.push({
            id: obs.id,
            genus,
            name: obs.taxon && obs.taxon.name ? obs.taxon.name : (obs.species_guess || genus),
            lat,
            lon,
            observedOn: obs.observed_on || '',
            place: obs.place_guess || ''
          });
        }

        if (!results.length) break;
        page += 1;
      }

      return records;
    }

    async function ensureInatLoaded() {
      if (inatLoaded || inatLoading) return;
      inatLoading = true;
      inatError = '';
      drawMap();

      try {
        const results = await Promise.all(focalGenera.map(fetchInatGenus));
        inatRecords = results.flat();
        inatLoaded = true;
      } catch (error) {
        document.getElementById('inat-toggle').checked = false;
        inatError = error.message;
        console.error(error);
      } finally {
        inatLoading = false;
        drawMap();
      }
    }

    async function loadData() {
      const [museumResponse, fstResponse, countyResponse] = await Promise.all([
        fetch('AU-termite-samples.csv'),
        fetch('FSTrecords.csv'),
        fetch(countyUrl)
      ]);

      if (!museumResponse.ok) throw new Error(`Museum CSV request failed: ${museumResponse.status}`);
      if (!fstResponse.ok) throw new Error(`FST CSV request failed: ${fstResponse.status}`);
      if (!countyResponse.ok) throw new Error(`County boundary request failed: ${countyResponse.status}`);

      const rows = parseCsv(await museumResponse.text());
      fstRecords = parseCsv(await fstResponse.text());
      countyGeojson = await countyResponse.json();

      museumRecords = rows.filter(row => {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const state = String(row.state || '').trim().toUpperCase();
        const country = String(row.country || '').trim().toUpperCase();
        return Number.isFinite(lat) && Number.isFinite(lon) &&
          state === 'AL' && country === 'USA' &&
          pointInAlabama(lon, lat) && focalGenera.includes(row.genus);
      });

      const bounds = countyGeojson.features.map(feature => L.geoJSON(feature).getBounds());
      if (bounds.length) {
        const combined = bounds.reduce((acc, current) => acc.extend(current), bounds[0]);
        map.fitBounds(combined, { padding: [10, 10] });
      }

      drawMap();
      setTimeout(() => map.invalidateSize(), 0);
    }

    document.getElementById('genus-select').addEventListener('change', drawMap);
    document.getElementById('specimen-toggle').addEventListener('change', drawMap);
    document.getElementById('fst-toggle').addEventListener('change', drawMap);
    document.getElementById('inat-toggle').addEventListener('change', event => {
      if (event.target.checked) ensureInatLoaded();
      else drawMap();
    });

    window.addEventListener('resize', () => map.invalidateSize());

    loadData().catch(error => {
      document.getElementById('status').textContent = `Could not load map data: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
