<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alabama Termite Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 10px 16px 9px; border-bottom: 1px solid #ddd; background: #fff; }
    h1 { margin: 0 0 3px; font-size: 1.35rem; }
    .intro { margin: 0; color: #555; font-size: .84rem; line-height: 1.3; }
    #status { margin-top: 3px; color: #777; font-size: .78rem; }
    #map { flex: 1; min-height: 0; }
    .leaflet-popup-content { line-height: 1.4; }
    .species { font-style: italic; }
    .taxon-name { font-weight: 700; }
    .map-panel { background: rgba(255,255,255,.96); padding: 10px 12px; border-radius: 5px; box-shadow: 0 1px 5px rgba(0,0,0,.35); font-size: .84rem; }
    .filter-panel { width: 290px; }
    .source-panel { width: 350px; max-width: calc(100vw - 40px); font-size: .75rem; line-height: 1.35; }
    .source-panel summary { cursor: pointer; font-weight: 700; }
    .source-panel p { margin: 7px 0 0; }
    .source-panel a { color: #145a86; }
    .control-group + .control-group { margin-top: 11px; }
    .control-label { display: block; margin-bottom: 5px; font-size: .72rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .03em; }
    .filter-panel select { width: 100%; box-sizing: border-box; padding: 5px 7px; font-size: .82rem; }
    .checks { display: flex; flex-direction: column; gap: 6px; line-height: 1.25; }
    .checks label { display: flex; gap: 6px; align-items: flex-start; }
    .checks input { margin-top: 2px; }
    .legend { line-height: 1.45; }
    .legend-title { font-weight: 700; margin-bottom: 4px; }
    .legend-section { margin-top: 6px; font-size: .76rem; font-weight: 700; color: #666; }
    .legend-item { white-space: nowrap; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 7px 0 1px; border: 1px solid currentColor; vertical-align: 0; }
    .legend-area { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin: 0 4px 0 -2px; border: 1.5px solid currentColor; vertical-align: -4px; }
    .legend-box { display: inline-block; width: 11px; height: 11px; margin-right: 6px; border: 1px solid currentColor; vertical-align: -1px; }
    @media (max-width: 620px) {
      header { padding: 8px 10px 7px; }
      h1 { font-size: 1.15rem; }
      .intro { display: none; }
      .filter-panel { width: 245px; }
      .map-panel { padding: 8px 9px; font-size: .76rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Alabama Termite Map</h1>
    <p class="intro">Documented Alabama termite records from museum vouchers, published county records, and an optional static iNaturalist snapshot.</p>
    <div id="status">Loading map data...</div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([32.8, -86.8], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const countyLayer = L.layerGroup().addTo(map);
    const inatLayer = L.layerGroup().addTo(map);
    const specimenLayer = L.layerGroup().addTo(map);

    let config = null;
    let museumRecords = [];
    let fstRecords = [];
    let inatRecords = [];
    let inatLoaded = false;
    let inatLoading = false;
    let inatError = '';
    let countyGeojson = null;
    let snapshotDate = 'not available';
    let legendControl = null;

    function fetchLocal(path) {
      return fetch(path, { cache: 'no-cache' });
    }

    function parseCsv(text) {
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: header => header.replace(/^\uFEFF/, '').trim()
      });
      if (parsed.errors.length) throw new Error(parsed.errors[0].message);
      return parsed.data;
    }

    function focalGenera() {
      return Object.keys(config.taxa);
    }

    function taxonConfig(genus) {
      return config.taxa[genus] || {};
    }

    function genusDisplayName(genus) {
      return taxonConfig(genus).display_name || genus;
    }

    function speciesColor(name, genus) {
      return config.species_colors[name] || taxonConfig(genus).color || config.fallback_color;
    }

    function scientificName(row) {
      return [row.genus, row.species].filter(Boolean).join(' ') || 'Unidentified termite';
    }

    function displayScientificName(name) {
      const common = config.scientific_common_names[name];
      if (common) return `${common} (${name})`;
      if (name.startsWith('Reticulitermes')) return `Native subterranean termite (${name})`;
      return name;
    }

    function museumDisplayName(row) {
      return displayScientificName(scientificName(row));
    }

    function normalizeCounty(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+county$/, '');
    }

    function selectedGenus() {
      return document.getElementById('genus-select').value;
    }

    function selectedDisplayName() {
      const selected = selectedGenus();
      return selected === 'all' ? 'all focal termites' : genusDisplayName(selected);
    }

    function genusMatches(genus) {
      const selected = selectedGenus();
      return selected === 'all' || genus === selected;
    }

    function fstIsRelevant() {
      const selected = selectedGenus();
      return selected === 'all' || selected === 'Coptotermes';
    }

    function isGeneralized(row) {
      return String(row.coordinate_generalized || '').trim().toLowerCase() === 'yes';
    }

    function privacyRadius(row) {
      const value = Number(row.privacy_radius_m);
      return Number.isFinite(value) && value > 0 ? value : 300;
    }

    function addFilterControl() {
      const filterControl = L.control({ position: 'topright' });
      filterControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-panel filter-panel');
        const options = Object.entries(config.taxa).map(([genus, item]) =>
          `<option value="${genus}">${item.selector_label}</option>`
        ).join('');
        div.innerHTML = `
          <div class="control-group">
            <label class="control-label" for="genus-select">Termite</label>
            <select id="genus-select" autocomplete="off">
              ${options}
              <option value="all">All termites</option>
            </select>
          </div>
          <div class="control-group">
            <span class="control-label">Evidence</span>
            <div class="checks">
              <label><input type="checkbox" id="fst-toggle" autocomplete="off"> <span>Published county records</span></label>
              <label><input type="checkbox" id="specimen-toggle" autocomplete="off"> <span>Verified museum specimens</span></label>
              <label><input type="checkbox" id="inat-toggle" autocomplete="off"> <span>iNaturalist Research Grade</span></label>
            </div>
          </div>`;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      };
      filterControl.addTo(map);

      document.getElementById('genus-select').value = config.defaults.taxon;
      document.getElementById('fst-toggle').checked = Boolean(config.defaults.published_counties);
      document.getElementById('specimen-toggle').checked = Boolean(config.defaults.museum_specimens);
      document.getElementById('inat-toggle').checked = Boolean(config.defaults.inaturalist);

      document.getElementById('genus-select').addEventListener('change', drawMap);
      document.getElementById('specimen-toggle').addEventListener('change', drawMap);
      document.getElementById('fst-toggle').addEventListener('change', drawMap);
      document.getElementById('inat-toggle').addEventListener('change', event => {
        if (!event.target.checked) {
          drawMap();
          return;
        }
        ensureInatLoaded();
      });
    }

    function addSourceControl() {
      const sourceControl = L.control({ position: 'bottomleft' });
      sourceControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-panel source-panel');
        div.innerHTML = `
          <details>
            <summary>Sources & references</summary>
            <p><strong>Published county records:</strong> Hu, X. P. & Mizumoto, N. (2026, in press). <em>Four decades of inland invasion by Formosan subterranean termite in Alabama: expansion associated with transportation infrastructure.</em> <a href="https://doi.org/10.32942/X21H4M" target="_blank" rel="noopener">Preprint</a>.</p>
            <p><strong>Verified specimens:</strong> Auburn University Natural History Museum / Alabama Termite Identification Service. Public specimen coordinates are privacy-generalized by up to 300 m and are shown only as location-uncertainty areas.</p>
            <p><strong>iNaturalist:</strong> Static snapshot dated <span id="inat-snapshot-date">${snapshotDate}</span>. Records are licensed Research Grade/community-assessed observations and are not independently verified by the Alabama Termite Identification Service. Each point links to the original observation.</p>
            <p><strong>Boundaries:</strong> Local Alabama county snapshot from U.S. Census Bureau TIGERweb. Basemap tiles are from OpenStreetMap.</p>
          </details>`;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      };
      sourceControl.addTo(map);
    }

    function updateLegend(visibleMuseumRecords, visibleInatRecords, showFst, showInat) {
      if (legendControl) map.removeControl(legendControl);

      const museumGenera = [...new Set(
        visibleMuseumRecords.filter(isGeneralized).map(row => row.genus).filter(Boolean)
      )].sort();

      const visibleInatSpecies = [...new Map(
        visibleInatRecords.map(row => [row.name, row])
      ).values()].sort((a, b) => a.name.localeCompare(b.name));

      legendControl = L.control({ position: 'bottomright' });
      legendControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-panel legend');
        const countyStyle = config.layers.published_counties;
        const countyItem = showFst
          ? `<div class="legend-item" style="color:${countyStyle.fill_color}"><span class="legend-box" style="background:${countyStyle.fill_color};opacity:${countyStyle.fill_opacity}"></span><span style="color:#333">Formosan subterranean termite county record</span></div>`
          : '';

        const museumItems = museumGenera.map(genus => {
          const color = taxonConfig(genus).color || config.fallback_color;
          return `<div class="legend-item" style="color:${color}"><span class="legend-area" style="background:${color};opacity:${config.layers.museum_specimens.fill_opacity}"></span><span style="color:#333">${genusDisplayName(genus)} privacy-generalized specimen</span></div>`;
        }).join('');

        const inatItems = showInat ? visibleInatSpecies.map(row => {
          const color = speciesColor(row.name, row.genus);
          return `<div class="legend-item" style="color:${color}"><span class="legend-dot" style="background:${color};opacity:${config.layers.inaturalist.fill_opacity}"></span><span style="color:#333">${displayScientificName(row.name)}</span> <span style="color:#666">iNaturalist</span></div>`;
        }).join('') : '';

        div.innerHTML = `
          <div class="legend-title">Records</div>
          ${countyItem}
          ${museumItems ? `<div class="legend-section">Verified specimens</div>${museumItems}` : ''}
          ${inatItems ? `<div class="legend-section">iNaturalist Research Grade</div>${inatItems}` : ''}`;
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      legendControl.addTo(map);
    }

    function drawMap() {
      countyLayer.clearLayers();
      inatLayer.clearLayers();
      specimenLayer.clearLayers();

      const showSpecimens = document.getElementById('specimen-toggle').checked;
      const showFst = document.getElementById('fst-toggle').checked && fstIsRelevant();
      const showInat = document.getElementById('inat-toggle').checked && inatLoaded;
      const visibleMuseumRecords = museumRecords.filter(row => genusMatches(row.genus));
      const visibleInatRecords = inatRecords.filter(row => genusMatches(row.genus));

      if (showFst && countyGeojson) {
        const style = config.layers.published_counties;
        const fstByCounty = Object.fromEntries(
          fstRecords.map(row => [normalizeCounty(row.County), row])
        );

        L.geoJSON(countyGeojson, {
          filter: feature => Boolean(fstByCounty[normalizeCounty(feature.properties.BASENAME)]),
          style: {
            color: style.stroke_color,
            weight: style.stroke_weight,
            fillColor: style.fill_color,
            fillOpacity: style.fill_opacity
          },
          onEachFeature: (feature, layer) => {
            const record = fstByCounty[normalizeCounty(feature.properties.BASENAME)];
            layer.bindPopup([
              '<span class="taxon-name">Formosan subterranean termite</span> <span class="species">(Coptotermes formosanus)</span>',
              `${record.County} County`,
              `First detected: ${record.FirstDetectedYear}`,
              'Evidence: published county-level record',
              '<a href="https://doi.org/10.32942/X21H4M" target="_blank" rel="noopener">Hu & Mizumoto (2026, in press)</a>',
              'County shading indicates documented occurrence, not occurrence throughout the county.'
            ].join('<br>'));
          }
        }).addTo(countyLayer);
      }

      if (showInat) {
        const style = config.layers.inaturalist;
        for (const row of visibleInatRecords) {
          const color = speciesColor(row.name, row.genus);
          const popup = [
            `<span class="taxon-name">${displayScientificName(row.name)}</span>`,
            row.place || 'Alabama',
            row.observedOn ? `Observed: ${row.observedOn}` : '',
            row.observer ? `Observer: ${row.observer}` : '',
            row.license ? `Observation license: ${row.license}` : '',
            'Evidence: iNaturalist Research Grade',
            'Community assessed and not independently verified by the Alabama Termite Identification Service',
            row.url ? `<a href="${row.url}" target="_blank" rel="noopener">View original iNaturalist observation</a>` : ''
          ].filter(Boolean).join('<br>');

          L.circleMarker([row.lat, row.lon], {
            radius: style.radius_px,
            color,
            opacity: style.stroke_opacity,
            weight: style.stroke_weight,
            fillColor: color,
            fillOpacity: style.fill_opacity
          }).bindPopup(popup).addTo(inatLayer);
        }
      }

      if (showSpecimens) {
        const style = config.layers.museum_specimens;
        for (const row of visibleMuseumRecords) {
          if (!isGeneralized(row)) continue;

          const lat = Number(row.lat);
          const lon = Number(row.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

          const name = scientificName(row);
          const color = speciesColor(name, row.genus);
          const radius = privacyRadius(row);
          const popup = [
            `<span class="taxon-name">${museumDisplayName(row)}</span>`,
            row.AUT_ID ? `Voucher: ${row.AUT_ID}` : '',
            row.date ? `Collected: ${row.date}` : '',
            'Evidence: verified museum specimen',
            `Public coordinate displaced by up to ${radius} m for privacy`,
            `The ${radius} m circle is a location-uncertainty area, not biological range, territory, colony size, or infestation extent`,
            'Source: Auburn University Natural History Museum'
          ].filter(Boolean).join('<br>');

          L.circle([lat, lon], {
            radius,
            color,
            opacity: style.stroke_opacity,
            weight: style.stroke_weight,
            fillColor: color,
            fillOpacity: style.fill_opacity
          }).bindPopup(popup).addTo(specimenLayer);
        }
      }

      const generalizedMuseum = visibleMuseumRecords.filter(isGeneralized);
      const legacyExactMuseum = visibleMuseumRecords.filter(row => !isGeneralized(row) && Number.isFinite(Number(row.lat)) && Number.isFinite(Number(row.lon)));
      const museumCount = showSpecimens ? generalizedMuseum.length : 0;
      const inatCount = showInat ? visibleInatRecords.length : 0;
      const parts = [`${museumCount} privacy-generalized museum records for ${selectedDisplayName()}`];

      if (showSpecimens && legacyExactMuseum.length) {
        parts.push(`${legacyExactMuseum.length} legacy exact-coordinate museum records hidden until public data are regenerated`);
      }
      if (showFst) parts.push(`${fstRecords.length} published counties`);
      if (document.getElementById('inat-toggle').checked) {
        if (inatLoading) parts.push('loading local iNaturalist snapshot');
        else if (inatLoaded) parts.push(`${inatCount} licensed iNaturalist Research Grade observations`);
      }
      if (inatError) parts.push('iNaturalist snapshot unavailable');

      document.getElementById('status').textContent = `${parts.join('; ')}.`;

      updateLegend(
        showSpecimens ? visibleMuseumRecords : [],
        showInat ? visibleInatRecords : [],
        showFst && Boolean(countyGeojson),
        showInat
      );
    }

    async function ensureInatLoaded() {
      if (inatLoaded) {
        drawMap();
        return;
      }
      if (inatLoading) return;

      inatLoading = true;
      inatError = '';
      drawMap();

      try {
        const response = await fetchLocal('iNaturalist_records.csv');
        if (!response.ok) throw new Error(`iNaturalist snapshot request failed: ${response.status}`);

        const rows = parseCsv(await response.text());
        inatRecords = rows.map(row => ({
          id: row.id || '',
          genus: row.genus || '',
          name: row.name || row.genus || '',
          lat: Number(row.lat),
          lon: Number(row.lon),
          observedOn: row.observed_on || '',
          place: row.place || '',
          observer: row.observer || '',
          license: row.license || '',
          url: row.url || ''
        })).filter(row =>
          Number.isFinite(row.lat) &&
          Number.isFinite(row.lon) &&
          focalGenera().includes(row.genus) &&
          Boolean(row.license)
        );

        inatLoaded = true;
      } catch (error) {
        document.getElementById('inat-toggle').checked = false;
        inatError = error.message;
        console.error(error);
      } finally {
        inatLoading = false;
        drawMap();
      }
    }

    async function loadData() {
      const [
        configResponse,
        museumResponse,
        fstResponse,
        countyResponse,
        metadataResponse
      ] = await Promise.all([
        fetchLocal('map_config.json'),
        fetchLocal('AU-termite-samples.csv'),
        fetchLocal('FSTrecords.csv'),
        fetchLocal('alabama_counties.geojson'),
        fetchLocal('external_data_snapshot.json')
      ]);

      if (!configResponse.ok) throw new Error(`Map config request failed: ${configResponse.status}`);
      if (!museumResponse.ok) throw new Error(`Museum CSV request failed: ${museumResponse.status}`);
      if (!fstResponse.ok) throw new Error(`FST CSV request failed: ${fstResponse.status}`);
      if (!countyResponse.ok) throw new Error(`County boundary request failed: ${countyResponse.status}`);

      config = await configResponse.json();
      const rows = parseCsv(await museumResponse.text());
      fstRecords = parseCsv(await fstResponse.text());
      countyGeojson = await countyResponse.json();

      if (metadataResponse.ok) {
        const metadata = await metadataResponse.json();
        snapshotDate = metadata.inaturalist && metadata.inaturalist.snapshot_date
          ? metadata.inaturalist.snapshot_date
          : metadata.updated || snapshotDate;
      }

      museumRecords = rows.filter(row => {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const state = String(row.state || '').trim().toUpperCase();
        const country = String(row.country || '').trim().toUpperCase();
        return Number.isFinite(lat) &&
          Number.isFinite(lon) &&
          state === 'AL' &&
          ['USA', 'US', 'UNITED STATES'].includes(country) &&
          focalGenera().includes(row.genus);
      });

      addFilterControl();
      addSourceControl();

      const target = document.getElementById('inat-snapshot-date');
      if (target) target.textContent = snapshotDate;

      const bounds = L.geoJSON(countyGeojson).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [10, 10] });

      drawMap();

      if (config.defaults.inaturalist) ensureInatLoaded();

      setTimeout(() => map.invalidateSize(), 0);
    }

    window.addEventListener('resize', () => map.invalidateSize());

    loadData().catch(error => {
      document.getElementById('status').textContent = `Could not load map data: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
