<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alabama Termite Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 14px 18px 10px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 4px; font-size: 1.45rem; }
    p { margin: 0; color: #555; font-size: 0.92rem; }
    #status { margin-top: 6px; font-size: 0.82rem; color: #777; }
    #map { flex: 1; min-height: 420px; }
    .leaflet-popup-content { line-height: 1.4; }
    .species { font-style: italic; font-weight: 700; }
    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      line-height: 1.5;
      font-size: 0.82rem;
    }
    .legend-title { font-weight: 700; margin-bottom: 4px; }
    .legend-item { white-space: nowrap; }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid #333;
      vertical-align: -1px;
    }
    .legend-species { font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Alabama Termite Map</h1>
    <p>Verified specimen records from the AU Natural History Museum dataset.</p>
    <div id="status">Loading AU-termite-samples.csv...</div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([32.8, -86.8], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const palette = [
      '#1f77b4',
      '#ff7f0e',
      '#2ca02c',
      '#d62728',
      '#9467bd',
      '#8c564b',
      '#e377c2',
      '#7f7f7f',
      '#bcbd22',
      '#17becf',
      '#393b79',
      '#637939'
    ];

    function speciesName(row) {
      return [row.genus, row.species].filter(Boolean).join(' ') || 'Unidentified termite';
    }

    function addLegend(speciesColors) {
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        const items = Object.entries(speciesColors).map(([species, color]) =>
          `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span><span class="legend-species">${species}</span></div>`
        ).join('');
        div.innerHTML = `<div class="legend-title">Species</div>${items}`;
        return div;
      };
      legend.addTo(map);
    }

    async function loadData() {
      const response = await fetch('AU-termite-samples.csv');
      if (!response.ok) throw new Error(`CSV request failed: ${response.status}`);
      const text = await response.text();
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: header => header.replace(/^\uFEFF/, '').trim()
      });

      if (parsed.errors.length) {
        throw new Error(parsed.errors[0].message);
      }

      const rows = parsed.data;
      const records = rows.filter(row => {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const state = String(row.state || '').trim().toUpperCase();
        const country = String(row.country || '').trim().toUpperCase();
        return Number.isFinite(lat) && Number.isFinite(lon) &&
          state === 'AL' && country === 'USA' &&
          lat >= 30.1 && lat <= 35.2 && lon >= -88.6 && lon <= -84.8;
      });

      const species = [...new Set(records.map(speciesName))].sort();
      const speciesColors = Object.fromEntries(
        species.map((name, index) => [name, palette[index % palette.length]])
      );

      const bounds = [];

      for (const row of records) {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const name = speciesName(row);
        const place = [row.locality, row.city].filter(Boolean).join(', ');
        const popup = [
          `<span class="species">${name}</span>`,
          row.AUT_ID ? `Voucher: ${row.AUT_ID}` : '',
          place || 'Alabama',
          row.date ? `Collected: ${row.date}` : '',
          'Source: AU Natural History Museum'
        ].filter(Boolean).join('<br>');

        L.circleMarker([lat, lon], {
          radius: 6,
          color: '#333',
          weight: 1,
          fillColor: speciesColors[name],
          fillOpacity: 0.85
        }).bindPopup(popup).addTo(map);
        bounds.push([lat, lon]);
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
      }

      addLegend(speciesColors);

      document.getElementById('status').textContent =
        `${records.length} Alabama records displayed across ${species.length} species from ${rows.length} CSV rows.`;
    }

    loadData().catch(error => {
      document.getElementById('status').textContent = `Could not load map data: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
