<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alabama Termite Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 14px 18px 10px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 4px; font-size: 1.45rem; }
    p { margin: 0; color: #555; font-size: 0.92rem; }
    #status { margin-top: 6px; font-size: 0.82rem; color: #777; }
    #map { flex: 1; min-height: 420px; }
    .leaflet-popup-content { line-height: 1.4; }
    .species { font-style: italic; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>Alabama Termite Map</h1>
    <p>Prototype showing the first 25 museum records with usable Alabama coordinates.</p>
    <div id="status">Loading AU-termite-samples.csv...</div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([32.8, -86.8], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function speciesName(row) {
      return [row.genus, row.species].filter(Boolean).join(' ') || 'Termite specimen';
    }

    async function loadData() {
      const response = await fetch('AU-termite-samples.csv');
      if (!response.ok) throw new Error(`CSV request failed: ${response.status}`);
      const text = await response.text();
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        transformHeader: header => header.replace(/^\uFEFF/, '').trim()
      });

      if (parsed.errors.length) {
        throw new Error(parsed.errors[0].message);
      }

      const rows = parsed.data;
      const records = rows.filter(row => {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const state = String(row.state || '').trim().toUpperCase();
        const country = String(row.country || '').trim().toUpperCase();
        return Number.isFinite(lat) && Number.isFinite(lon) &&
          state === 'AL' && country === 'USA' &&
          lat >= 30.1 && lat <= 35.2 && lon >= -88.6 && lon <= -84.8;
      }).slice(0, 25);

      const bounds = [];

      for (const row of records) {
        const lat = Number(row.lat);
        const lon = Number(row.lon);
        const name = speciesName(row);
        const place = [row.locality, row.city].filter(Boolean).join(', ');
        const popup = [
          `<span class="species">${name}</span>`,
          row.AUT_ID ? `Voucher: ${row.AUT_ID}` : '',
          place || 'Alabama',
          row.date ? `Collected: ${row.date}` : '',
          'Source: AU Natural History Museum'
        ].filter(Boolean).join('<br>');

        L.circleMarker([lat, lon], {
          radius: 6,
          weight: 1,
          fillOpacity: 0.8
        }).bindPopup(popup).addTo(map);
        bounds.push([lat, lon]);
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
      }

      document.getElementById('status').textContent =
        `${records.length} Alabama records displayed from ${rows.length} CSV rows.`;
    }

    loadData().catch(error => {
      document.getElementById('status').textContent = `Could not load map data: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
